{% extends "base.html" %}

{% block title %}Delete book - Reading List{% endblock %}

{% block content %}
<div class="panel">
    <h1>Delete book</h1>
    <p>Are you sure you want to delete <strong>{{ object.title }}</strong> by {{ object.author }}? This cannot be undone.</p>
    <form method="post">
        {% csrf_token %}
        <div class="form-actions">
            <button class="btn btn-danger" type="submit">Yes, delete</button>
            <a class="btn" href="{% url 'home' %}">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
